modLoader="javafml"
loaderVersion="[1,)"
license="${license}"
issueTrackerURL="${issue_tracker}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
displayURL="${homepage}"
authors="${mod_authors}"
description='''
${mod_description}
'''
mixinConfigs=["meteor-client.mixins.json", "meteor-client-baritone.mixins.json"]

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="[${loader_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version},)"
ordering="NONE"
side="CLIENT"
